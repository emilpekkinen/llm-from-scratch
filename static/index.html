<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NumPyGPT</title>
<style>
  :root {
    --sidebar: #202123; --main: #343541; --assistant: #444654; --input: #40414f;
    --border: rgba(255,255,255,.2); --text: #ececf1; --muted: #c5c5d2; --dim: #8e8ea0;
    --green: #10a37f; --user: #5436da;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--main); color: var(--text); display: flex; overflow: hidden;
         font: 16px/1.6 "Söhne", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  button, input { font: inherit; color: inherit; }

  /* ---------- sidebar ---------- */
  #sidebar { width: 260px; flex: none; background: var(--sidebar); display: flex; flex-direction: column; padding: 8px; gap: 8px; }
  .side-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 6px;
              background: none; border: 1px solid transparent; cursor: pointer; text-align: left; font-size: 14px; }
  .side-btn:hover { background: #2a2b32; }
  #new-chat { border-color: var(--border); }
  #chats { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .chat-item { position: relative; }
  .chat-item .side-btn { padding-right: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .chat-item.active .side-btn { background: #343541; }
  .chat-item .del { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0;
                    color: var(--dim); cursor: pointer; display: none; padding: 4px; }
  .chat-item:hover .del, .chat-item.active .del { display: block; }
  .chat-item .del:hover { color: var(--text); }
  #settings { border-top: 1px solid var(--border); padding: 12px 8px 4px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; }
  #settings label { display: flex; justify-content: space-between; color: var(--muted); }
  #settings input[type=range] { width: 100%; accent-color: var(--green); }
  #settings .check { justify-content: flex-start; gap: 8px; cursor: pointer; }
  #model-info { color: var(--dim); font-size: 12px; line-height: 1.5; padding: 4px 8px 8px; }

  /* ---------- main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
  #mobile-bar { display: none; align-items: center; justify-content: space-between; padding: 8px 12px;
                border-bottom: 1px solid var(--border); background: var(--main); }
  #mobile-bar button { background: none; border: 0; cursor: pointer; padding: 4px; }
  #thread { flex: 1; overflow-y: auto; padding-bottom: 180px; }
  .row { border-bottom: 1px solid rgba(0,0,0,.1); }
  .row.assistant { background: var(--assistant); }
  .row-inner { max-width: 768px; margin: 0 auto; padding: 24px 16px; display: flex; gap: 24px; }
  .avatar { width: 30px; height: 30px; border-radius: 2px; flex: none; display: grid; place-items: center;
            font-size: 11px; font-weight: 600; color: #fff; }
  .user .avatar { background: var(--user); }
  .assistant .avatar { background: var(--green); }
  .msg { white-space: pre-wrap; word-wrap: break-word; min-width: 0; flex: 1; color: #d1d5db; padding-top: 2px; }
  .user .msg { color: var(--text); }
  .msg.error { color: #ef8b8b; }
  .cursor::after { content: "▋"; animation: blink 1s steps(2) infinite; margin-left: 2px; }
  @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* ---------- empty state ---------- */
  #welcome { max-width: 768px; margin: 0 auto; padding: 12vh 16px 0; text-align: center; }
  #welcome h1 { font-size: 36px; font-weight: 600; margin: 0 0 56px; }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; text-align: center; }
  .col h2 { font-size: 17px; font-weight: 400; margin: 0 0 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .col li { background: rgba(255,255,255,.05); border-radius: 6px; padding: 12px; font-size: 14px; }
  .col button.example { all: unset; display: block; cursor: pointer; background: rgba(255,255,255,.05);
                        border-radius: 6px; padding: 12px; font-size: 14px; }
  .col button.example:hover { background: #202123; }

  /* ---------- composer ---------- */
  #bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 32px 16px 12px;
            background: linear-gradient(180deg, rgba(53,55,64,0), var(--main) 40%); }
  #bottom-inner { max-width: 768px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #actions button { display: flex; align-items: center; gap: 8px; background: var(--main); border: 1px solid #565869;
                    border-radius: 4px; padding: 7px 12px; font-size: 14px; cursor: pointer; }
  #actions button:hover { background: var(--input); }
  #composer { position: relative; width: 100%; background: var(--input); border: 1px solid rgba(32,33,35,.5);
              border-radius: 6px; box-shadow: 0 0 15px rgba(0,0,0,.1); }
  #prompt { display: block; width: 100%; resize: none; border: 0; outline: none; background: transparent; color: var(--text);
            font: inherit; padding: 12px 48px 12px 16px; max-height: 200px; line-height: 24px; }
  #prompt::placeholder { color: var(--dim); }
  #send { position: absolute; right: 8px; bottom: 8px; background: none; border: 0; border-radius: 6px;
          padding: 6px; cursor: pointer; color: var(--dim); display: grid; place-items: center; }
  #send:hover:not(:disabled) { background: #202123; color: var(--text); }
  #send:disabled { opacity: .4; cursor: default; }
  #disclaimer { font-size: 12px; color: rgba(255,255,255,.5); text-align: center; }
  #disclaimer code { font-size: 11px; }

  @media (max-width: 760px) {
    #sidebar { position: fixed; z-index: 10; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .2s; }
    body.side-open #sidebar { transform: none; }
    #mobile-bar { display: flex; }
    .cols { grid-template-columns: 1fr; }
    #welcome { padding-top: 6vh; }
    #welcome h1 { margin-bottom: 28px; }
    .row-inner { gap: 16px; }
  }
</style>
</head>
<body>
<nav id="sidebar">
  <button class="side-btn" id="new-chat">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    New chat
  </button>
  <div id="chats"></div>
  <div id="settings">
    <label>Temperature <span id="temp-val"></span></label>
    <input type="range" id="temperature" min="0.1" max="1.5" step="0.05" value="0.8">
    <label>Top-k <span id="topk-val"></span></label>
    <input type="range" id="top_k" min="1" max="200" step="1" value="40">
    <label>Max new tokens <span id="max-val"></span></label>
    <input type="range" id="max_new_tokens" min="20" max="600" step="10" value="200">
    <label class="check"><input type="checkbox" id="stop_at_speech" checked> Stop after one speech</label>
    <label class="check"><input type="checkbox" id="use_history" checked> Remember conversation</label>
  </div>
  <div id="model-info">Loading model…</div>
</nav>

<main id="main">
  <div id="mobile-bar">
    <button id="menu" aria-label="Open sidebar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <span>NumPyGPT</span>
    <button id="new-chat-m" aria-label="New chat"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div id="thread"></div>
  <div id="bottom">
    <div id="bottom-inner">
      <div id="actions"></div>
      <form id="composer">
        <textarea id="prompt" rows="1" placeholder="Send a message..."></textarea>
        <button id="send" type="submit" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" style="transform:rotate(90deg)"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
        </button>
      </form>
      <div id="disclaimer">NumPyGPT is a ~1M-parameter transformer trained from scratch in pure NumPy on Tiny Shakespeare. It will say Shakespeare-flavoured nonsense.</div>
    </div>
  </div>
</main>

<template id="welcome-tpl">
  <div id="welcome">
    <h1>NumPyGPT</h1>
    <div class="cols">
      <div class="col">
        <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>Examples</h2>
        <ul>
          <li><button class="example">ROMEO:</button></li>
          <li><button class="example">JULIET:&#10;O Romeo, Romeo! wherefore art thou Romeo?</button></li>
          <li><button class="example">KING RICHARD III:</button></li>
        </ul>
      </div>
      <div class="col">
        <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>Capabilities</h2>
        <ul>
          <li>Writes the next speech in a play, in iambic-ish verse</li>
          <li>Knows the character names from the training text</li>
          <li>Every matmul and gradient hand-written in NumPy</li>
        </ul>
      </div>
      <div class="col">
        <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"/></svg>Limitations</h2>
        <ul>
          <li>Doesn't follow instructions or answer questions</li>
          <li>Only sees the last 128 tokens of context</li>
          <li>Knows nothing beyond ~1 MB of Shakespeare</li>
        </ul>
      </div>
    </div>
  </div>
</template>

<script>
const $ = (s) => document.querySelector(s);
const thread = $("#thread"), promptEl = $("#prompt"), sendBtn = $("#send"), actions = $("#actions");

// ---------- persistence (per-browser convenience only) ----------
const store = {
  load() { try { return JSON.parse(localStorage.getItem("npgpt-chats")) || []; } catch { return []; } },
  save(chats) { try { localStorage.setItem("npgpt-chats", JSON.stringify(chats)); } catch {} },
};
let chats = store.load();          // [{id, title, messages:[{role, text}]}]
let current = null;                // active chat object
let controller = null;             // AbortController while streaming

// ---------- settings ----------
const settings = ["temperature", "top_k", "max_new_tokens"];
const labels = { temperature: "#temp-val", top_k: "#topk-val", max_new_tokens: "#max-val" };
for (const id of settings) {
  const el = $("#" + id);
  const show = () => { $(labels[id]).textContent = el.value; };
  el.addEventListener("input", show); show();
}

fetch("/api/info").then(r => r.json()).then(info => {
  $("#model-info").textContent = info.error ? info.error :
    `${(info.params / 1e6).toFixed(2)}M params · ${info.n_layer} layers · ${info.n_embd} dim · ctx ${info.block_size}\n` +
    `checkpoint step ${info.step} · val loss ${info.val_loss.toFixed(3)}`;
  $("#model-info").style.whiteSpace = "pre-line";
}).catch(() => { $("#model-info").textContent = "Server not reachable"; });

// ---------- rendering ----------
function renderSidebar() {
  const list = $("#chats");
  list.innerHTML = "";
  for (const c of chats) {
    const item = document.createElement("div");
    item.className = "chat-item" + (c === current ? " active" : "");
    const b = document.createElement("button");
    b.className = "side-btn";
    b.textContent = c.title;
    b.onclick = () => { if (!controller) { openChat(c); document.body.classList.remove("side-open"); } };
    const del = document.createElement("button");
    del.className = "del"; del.setAttribute("aria-label", "Delete chat"); del.innerHTML = "&#x2715;";
    del.onclick = (e) => {
      e.stopPropagation();
      if (controller) return;
      chats = chats.filter(x => x !== c); store.save(chats);
      if (c === current) openChat(null); else renderSidebar();
    };
    item.append(b, del);
    list.append(item);
  }
}

function addRow(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  row.innerHTML = `<div class="row-inner"><div class="avatar">${role === "user" ? "You" : "GPT"}</div><div class="msg"></div></div>`;
  row.querySelector(".msg").textContent = text;
  thread.append(row);
  return row.querySelector(".msg");
}

function renderThread() {
  thread.innerHTML = "";
  if (!current || current.messages.length === 0) {
    thread.append($("#welcome-tpl").content.cloneNode(true));
    thread.querySelectorAll(".example").forEach(b => b.onclick = () => { promptEl.value = b.textContent; autosize(); send(); });
  } else {
    for (const m of current.messages) addRow(m.role, m.text);
  }
  renderActions();
  scrollDown();
}

function renderActions() {
  actions.innerHTML = "";
  if (controller) {
    const b = document.createElement("button");
    b.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>Stop generating`;
    b.onclick = () => controller.abort();
    actions.append(b);
  } else if (current && current.messages.at(-1)?.role === "assistant") {
    const b = document.createElement("button");
    b.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>Regenerate response`;
    b.onclick = regenerate;
    actions.append(b);
  }
}

function scrollDown() { thread.scrollTop = thread.scrollHeight; }

function openChat(c) { current = c; renderSidebar(); renderThread(); promptEl.focus(); }

// ---------- prompt construction ----------
// The model is a text continuer, not a chat model: the conversation is treated as one running play.
function buildPrompt(messages) {
  const useHistory = $("#use_history").checked;
  const msgs = useHistory ? messages : messages.slice(-1);
  let text = "";
  for (const m of msgs) {
    if (m.role === "user") text += m.text + (m.text.trimEnd().endsWith(":") ? "\n" : "\n\n");
    else text += m.text.replace(/^\n+/, "") + "\n\n";
  }
  return text.slice(-2000);   // the model only uses the last block_size tokens anyway
}

// ---------- streaming ----------
async function generate() {
  const msgEl = addRow("assistant", "");
  msgEl.classList.add("cursor");
  const reply = { role: "assistant", text: "" };
  controller = new AbortController();
  setBusy(true);
  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: buildPrompt(current.messages),
        temperature: +$("#temperature").value,
        top_k: +$("#top_k").value,
        max_new_tokens: +$("#max_new_tokens").value,
        stop_at_speech: $("#stop_at_speech").checked,
      }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      reply.text += dec.decode(value, { stream: true });
      msgEl.textContent = reply.text.replace(/^\n+/, "");
      scrollDown();
    }
  } catch (e) {
    if (e.name !== "AbortError") { msgEl.classList.add("error"); reply.text ||= "Error: " + e.message; msgEl.textContent = reply.text; }
  }
  msgEl.classList.remove("cursor");
  reply.text = reply.text.replace(/^\n+/, "");
  if (!msgEl.classList.contains("error")) current.messages.push(reply);
  controller = null;
  setBusy(false);
  store.save(chats);
  renderActions();
}

async function send() {
  const text = promptEl.value.trim();
  if (!text || controller) return;
  if (!current) {
    current = { id: Date.now(), title: text.split("\n")[0].slice(0, 40), messages: [] };
    chats.unshift(current);
  }
  if (current.messages.length === 0) thread.innerHTML = "";
  current.messages.push({ role: "user", text });
  promptEl.value = ""; autosize();
  addRow("user", text);
  renderSidebar();
  store.save(chats);
  await generate();
}

async function regenerate() {
  if (controller || current.messages.at(-1)?.role !== "assistant") return;
  current.messages.pop();
  thread.lastElementChild.remove();
  await generate();
}

function setBusy(busy) { sendBtn.disabled = busy; renderActions(); }

// ---------- composer ----------
function autosize() { promptEl.style.height = "auto"; promptEl.style.height = Math.min(promptEl.scrollHeight, 200) + "px"; }
promptEl.addEventListener("input", autosize);
promptEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("#composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
const newChat = () => { if (!controller) { openChat(null); document.body.classList.remove("side-open"); } };
$("#new-chat").onclick = newChat;
$("#new-chat-m").onclick = newChat;
$("#menu").onclick = () => document.body.classList.toggle("side-open");
$("#main").addEventListener("click", (e) => { if (!e.target.closest("#menu")) document.body.classList.remove("side-open"); });

openChat(null);
</script>
</body>
</html>
